{
  "lockfileVersion": 2,
  "updatedAt": "2026-11-01",
  "location": "Real skill folders live in ~/.agents/skills. ~/.claude/skills and ~/.copilot/skills each hold one junction per skill, made by ~/.agents/link-skills.ps1. ~/.claude/skills also has the app-managed synced and .trash folders, which are not registered here.",
  "packs": {
    "core": "Workflow skills that apply to every project",
    "web": "Web development: frontend and backend",
    "desktop": "Desktop development: Tauri and desktop app practices",
    "mobile": "Mobile development",
    "games": "Reserved for future Unity3D and Unreal Engine packs. No skills yet"
  },
  "rules": {
    "version": "local: date of the most recently changed file (YYYY-MM-DD). upstream: the version declared in SKILL.md, or commitDate when none is declared.",
    "contentHash": "sha256 of the file list, one \"<git blob sha1> <path>\\n\" line per file, sorted by path. Paths are relative to the skill folder with forward slashes. Before hashing, text files have CRLF converted to LF; a file with a NUL byte in its first 8000 bytes is binary and hashed as is. The same value can be computed from a GitHub tree listing, leaving out any paths in omit.",
    "update": [
      "Check for changes: compare each upstream skill's commit with the newest commit touching source.path on source.branch. Declared versions are rarely bumped, so never decide by version.",
      "Check for local edits: recompute contentHash before replacing a folder. A mismatch means edits that the update would overwrite.",
      "Update upstream skills: replace the folder in ~/.agents/skills with source.path at the new commit, leaving out paths in omit, then set commit, commitDate, version and contentHash.",
      "Update local skills: recompute contentHash. If it changed, store it and set version to the new update date.",
      "Skip entries marked discontinued: there is no upstream to pull from.",
      "Keep the list in sync: give any new folder that has a SKILL.md a pack and an entry, remove entries whose folder is gone, then set updatedAt.",
      "After adding or removing a skill, run ~/.agents/link-skills.ps1 so Claude Code and GitHub Copilot can discover it. Run it once on each new machine too."
    ]
  },
